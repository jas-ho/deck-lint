[project]
name = "deck-lint"
version = "0.1.0"
description = "Local slide PDF layout checks for coding agents"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pymupdf>=1.26,<2", "typer>=0.27,<0.28"]

[project.scripts]
deck-lint = "deck_lint:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deck_lint.py"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
